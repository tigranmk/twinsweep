[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twinsweep"
dynamic = ["version"]
description = "Find duplicate files by content and clean them up safely."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only
keywords = ["duplicates", "dedupe", "fdupes", "disk-space", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tigranmk/twinsweep"
Issues = "https://github.com/tigranmk/twinsweep/issues"

[project.optional-dependencies]
# Cross-platform "move to Trash/Recycle Bin". Without it, --action trash
# still works on macOS; on Linux/Windows it asks you to install this.
trash = ["Send2Trash>=1.8"]

[project.scripts]
twinsweep = "twinsweep.cli:main"

[tool.setuptools]
packages = ["twinsweep"]

[tool.setuptools.dynamic]
version = { attr = "twinsweep.__version__" }
